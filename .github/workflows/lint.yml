name: Static checks
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: bash tests/run-tests.sh static
      - name: Unit tests (no GPU or network)
        run: python3 -m unittest discover -s tests -p 'test_*.py'
