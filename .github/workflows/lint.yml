name: Static checks
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for s in scripts/*.sh; do bash -n "$s"; done
      - name: Python syntax and artifact checks
        run: python3 tests/static_check.py
